# Render blueprint for the backend. Secrets are entered in the dashboard (sync: false), never committed.
services:
  - type: web
    name: harvest-compass-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: LLM_MODEL
        value: deepseek/deepseek-v4.1-flash
      - key: NOMINATIM_USER_AGENT
        sync: false
      - key: VOICE_DAILY_LIMIT
        value: "60"
